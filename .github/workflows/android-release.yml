name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK + AAB
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.signing-status.outputs.signed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Run Flutter formatting check
        working-directory: apps/mobile
        run: flutter format --output=none --set-exit-if-changed .

      - name: Run Flutter analysis
        working-directory: apps/mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: apps/mobile
        run: flutter test

      - name: Detect signing availability
        id: signing-status
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create production .env from secrets
        working-directory: apps/mobile
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          WEATHERAPI_API_KEY: ${{ secrets.WEATHERAPI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          DTN_CLIENT_ID: ${{ secrets.DTN_CLIENT_ID }}
          DTN_CLIENT_SECRET: ${{ secrets.DTN_CLIENT_SECRET }}
          DTN_BASE_URL: ${{ secrets.DTN_BASE_URL }}
          DTN_AUTH_URL: ${{ secrets.DTN_AUTH_URL }}
          NOVU_API_KEY: ${{ secrets.NOVU_API_KEY }}
          TWILIO_ACCOUNT: ${{ secrets.TWILIO_ACCOUNT }}
        run: |
          if [ -n "$BACKEND_URL" ]; then
            cat > .env <<EOF
            APP_ENV=production
            BACKEND_URL=$BACKEND_URL
            WEATHERAPI_API_KEY=$WEATHERAPI_API_KEY
            GEMINI_API_KEY=$GEMINI_API_KEY
            GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY
            DTN_CLIENT_ID=$DTN_CLIENT_ID
            DTN_CLIENT_SECRET=$DTN_CLIENT_SECRET
            DTN_BASE_URL=$DTN_BASE_URL
            DTN_AUTH_URL=$DTN_AUTH_URL
            NOVU_API_KEY=$NOVU_API_KEY
            TWILIO_ACCOUNT=$TWILIO_ACCOUNT
            EOF
          else
            echo "::warning::BACKEND_URL secret not configured; using development default (no production build)."
          fi

      - name: Configure release signing keystore
        working-directory: apps/mobile
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/cyclonex-release-key.jks
            cat > android/app/key.properties <<EOF
            storeFile=cyclonex-release-key.jks
            storePassword=$STORE_PASSWORD
            keyAlias=$KEY_ALIAS
            keyPassword=$KEY_PASSWORD
            EOF
          else
            echo "::notice::No signing keystore configured; producing unsigned testing APK only (not a production release)."
          fi

      - name: Build release APK
        working-directory: apps/mobile
        run: flutter build apk --release

      - name: Build release AAB
        working-directory: apps/mobile
        run: flutter build appbundle --release

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: >
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: release-artifacts

      - name: Download release AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: CycloneX Android ${{ github.ref_name }}
          files: |
            release-artifacts/app-release.apk
            release-artifacts/app-release.aab
          draft: false
          prerelease: false
