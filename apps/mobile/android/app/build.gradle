plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release signing configuration.
// Keystore and passwords must NEVER be committed to Git.
// Local development: provide android/key.properties (gitignored).
// CI / GitHub Actions: set environment variables ANDROID_KEYSTORE_PATH,
// ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
def keyPropsFile = rootProject.file('key.properties')
def keyProps = new Properties()
def keystorePath = System.env.ANDROID_KEYSTORE_PATH ?: ''
def storePassword = System.env.ANDROID_STORE_PASSWORD ?: ''
def keyAlias = System.env.ANDROID_KEY_ALIAS ?: ''
def keyPassword = System.env.ANDROID_KEY_PASSWORD ?: ''

if (keyPropsFile.exists()) {
    keyPropsFile.withReader('UTF-8') { reader -> keyProps.load(reader) }
    keystorePath = keyProps.getProperty('storeFile', keystorePath)
    storePassword = keyProps.getProperty('storePassword', storePassword)
    keyAlias = keyProps.getProperty('keyAlias', keyAlias)
    keyPassword = keyProps.getProperty('keyPassword', keyPassword)
}

def isReleaseSigned = keystorePath != '' && new File(keystorePath).exists()

apply from: project(':flutter_config').projectDir.getPath() + "/dotenv.gradle"

android {
    namespace "com.cyclonex.app"
    compileSdkVersion 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    // Force compileSdkVersion >= 31 on all library subprojects (e.g. flutter_config
    // hardcodes compileSdkVersion 29) so platform attrs like android:attr/lStar
    // resolve during release resource linking.
    project.afterEvaluate {
        subprojects.each { sub ->
            if (sub.plugins.hasPlugin('com.android.library')) {
                sub.android.compileSdkVersion = 34
                sub.android.buildToolsVersion = '34.0.0'
            }
        }
    }

    defaultConfig {
        applicationId "com.cyclonex.app"
        minSdkVersion 23
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (isReleaseSigned) {
                storeFile file(keystorePath)
                storePassword storePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig isReleaseSigned ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
